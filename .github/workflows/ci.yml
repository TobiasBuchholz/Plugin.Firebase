name: ci

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode for .NET iOS workload
        run: |
          for xcode in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.6.0.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done

          echo "No compatible Xcode 26.6 installation found." >&2
          ls -1 /Applications/Xcode*.app >&2
          exit 1

      - name: Install .NET MAUI workloads
        run: |
          dotnet workload install maui --source https://api.nuget.org/v3/index.json
          dotnet workload list

      - name: Build packages
        run: |
          dotnet build src/Core/Core.csproj -c Release
          dotnet build src/Analytics/Analytics.csproj -c Release
          dotnet build src/AppCheck/AppCheck.csproj -c Release
          dotnet build src/Auth/Auth.csproj -c Release
          dotnet build src/CloudMessaging/CloudMessaging.csproj -c Release
          dotnet build src/Crashlytics/Crashlytics.csproj -c Release
          dotnet build src/Firestore/Firestore.csproj -c Release
          dotnet build src/Functions/Functions.csproj -c Release
          dotnet build src/Installations/Installations.csproj -c Release
          dotnet build src/RemoteConfig/RemoteConfig.csproj -c Release
          dotnet build src/Storage/Storage.csproj -c Release
          dotnet build src/Bundled/Bundled.csproj -c Release

      - name: Validate CloudMessaging trimming
        run: scripts/validate-cloudmessaging-trimming.sh

      - name: Validate Crashlytics compatibility
        run: scripts/validate-crashlytics-compatibility.sh

      - name: Run unit tests
        run: |
          dotnet restore tests/Plugin.Firebase.UnitTests/Plugin.Firebase.UnitTests.csproj
          dotnet test tests/Plugin.Firebase.UnitTests/Plugin.Firebase.UnitTests.csproj -c Release -f net10.0 --no-restore
