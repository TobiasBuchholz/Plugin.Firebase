name: integration-emulators

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-emulators-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFICATION_LEVEL: Disable
  FIREBASE_PROJECT_ID: demo-pluginfirebase-integrationtests

jobs:
  android:
    name: integration-emulators-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Install Firebase CLI
        run: scripts/install-integration-test-tools.sh

      - name: Check integration coverage metadata
        run: scripts/check-integration-coverage.rb

      - name: Build Cloud Functions
        run: |
          npm ci --prefix tests/cloud-functions/functions --legacy-peer-deps
          npm --prefix tests/cloud-functions/functions run build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests against emulators
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            bash -lc '"$GITHUB_WORKSPACE/scripts/run-integration-emulators.sh" android'

      - name: Summarize Android test results
        if: always()
        run: ruby scripts/write-trx-github-summary.rb "Android emulator integration tests" "artifacts/test-results/android"

      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-integration-results
          path: artifacts/test-results/android
          if-no-files-found: ignore

  ios:
    name: integration-emulators-ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-ios --source https://api.nuget.org/v3/index.json

      - name: Install Firebase CLI
        run: scripts/install-integration-test-tools.sh

      - name: Select Xcode for .NET iOS workload
        run: |
          for xcode in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.6.0.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              sdk_dir="$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs"
              if [ ! -e "$sdk_dir/MacOSX.sdk" ]; then
                macos_sdk=$(find "$sdk_dir" -maxdepth 1 -name "MacOSX*.sdk" -type d | sort | tail -n 1)
                if [ -z "$macos_sdk" ]; then
                  echo "No macOS SDK found under $sdk_dir." >&2
                  exit 1
                fi
                sudo ln -s "$(basename "$macos_sdk")" "$sdk_dir/MacOSX.sdk"
              fi
              xcrun --sdk macosx --show-sdk-path
              exit 0
            fi
          done

          echo "No compatible Xcode 26.6 installation found." >&2
          ls -1 /Applications/Xcode*.app >&2
          exit 1

      - name: Build Cloud Functions
        run: |
          npm ci --prefix tests/cloud-functions/functions --legacy-peer-deps
          npm --prefix tests/cloud-functions/functions run build

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl create PluginFirebaseIntegration "iPhone 16" || xcrun simctl create PluginFirebaseIntegration "iPhone 15")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iOS integration tests against emulators
        run: scripts/run-integration-emulators.sh ios

      - name: Cleanup iOS simulator
        if: always()
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl shutdown "$DEVICE_ID" || true
            xcrun simctl delete "$DEVICE_ID" || true
          fi

      - name: Summarize iOS test results
        if: always()
        run: ruby scripts/write-trx-github-summary.rb "iOS emulator integration tests" "artifacts/test-results/ios"

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-results
          path: artifacts/test-results/ios
          if-no-files-found: ignore
