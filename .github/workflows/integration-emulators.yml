name: integration-emulators

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-emulators-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFICATION_LEVEL: Disable
  FIREBASE_PROJECT_ID: demo-pluginfirebase-integrationtests

jobs:
  android:
    name: integration-emulators-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Install Firebase CLI and XHarness
        run: |
          npm install --global firebase-tools@15.15.0
          dotnet tool install --global Microsoft.DotNet.XHarness.CLI \
            --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json \
            --version "11.0.0-prerelease.26224.1"

      - name: Build Cloud Functions
        run: |
          npm ci --prefix tests/cloud-functions/functions --legacy-peer-deps
          npm --prefix tests/cloud-functions/functions run build

      - name: Build Android integration app
        run: dotnet build tests/Plugin.Firebase.IntegrationTests/Plugin.Firebase.IntegrationTests.csproj -c Debug -f net9.0-android

      - name: Resolve Android integration app metadata
        run: |
          ANDROID_PACKAGE_ID=$(dotnet msbuild tests/Plugin.Firebase.IntegrationTests/Plugin.Firebase.IntegrationTests.csproj \
            -getProperty:IntegrationTestsAndroidApplicationId \
            -p:TargetFramework=net9.0-android \
            | tr -d '\r\n')
          ANDROID_APK=$(find "$GITHUB_WORKSPACE/tests/Plugin.Firebase.IntegrationTests/bin/Debug/net9.0-android" \
            -name "${ANDROID_PACKAGE_ID}-Signed.apk" \
            -type f \
            -print \
            -quit)

          if [ -z "$ANDROID_PACKAGE_ID" ]; then
            echo "Could not resolve IntegrationTestsAndroidApplicationId." >&2
            exit 1
          fi

          if [ -z "$ANDROID_APK" ]; then
            echo "Could not find signed Android APK for package '$ANDROID_PACKAGE_ID'." >&2
            find "$GITHUB_WORKSPACE/tests/Plugin.Firebase.IntegrationTests/bin/Debug/net9.0-android" -name "*-Signed.apk" -type f >&2
            exit 1
          fi

          echo "ANDROID_PACKAGE_ID=$ANDROID_PACKAGE_ID" >> "$GITHUB_ENV"
          echo "ANDROID_APK=$ANDROID_APK" >> "$GITHUB_ENV"

      - name: Run Android integration tests against emulators
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            bash -lc 'export PATH="$PATH:$HOME/.dotnet/tools"; cd tests/cloud-functions && firebase emulators:exec --project "$FIREBASE_PROJECT_ID" --only auth,firestore,functions,storage "node scripts/seed-auth-emulator.js && xharness android test --timeout=00:10:00 --launch-timeout=00:10:00 --package-name $ANDROID_PACKAGE_ID --instrumentation devicerunners.xharness.maui.XHarnessInstrumentation --app $ANDROID_APK --output-directory ../../artifacts/test-results/android --verbosity=Debug"'

      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-results
          path: artifacts/test-results/android
          if-no-files-found: ignore

  ios:
    name: integration-emulators-ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install .NET MAUI workload
        run: sudo "$DOTNET_ROOT/dotnet" workload install maui --source https://api.nuget.org/v3/index.json

      - name: Install Firebase CLI and XHarness
        run: |
          npm install --global firebase-tools@15.15.0
          dotnet tool install --global Microsoft.DotNet.XHarness.CLI \
            --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json \
            --version "11.0.0-prerelease.26224.1"

      - name: Select Xcode for .NET iOS workload
        run: |
          for xcode in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.3.0.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              sdk_dir="$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs"
              if [ ! -e "$sdk_dir/MacOSX.sdk" ]; then
                macos_sdk=$(find "$sdk_dir" -maxdepth 1 -name "MacOSX*.sdk" -type d | sort | tail -n 1)
                if [ -z "$macos_sdk" ]; then
                  echo "No macOS SDK found under $sdk_dir." >&2
                  exit 1
                fi
                sudo ln -s "$(basename "$macos_sdk")" "$sdk_dir/MacOSX.sdk"
              fi
              xcrun --sdk macosx --show-sdk-path
              exit 0
            fi
          done

          echo "No compatible Xcode 26.3 installation found." >&2
          ls -1 /Applications/Xcode*.app >&2
          exit 1

      - name: Build Cloud Functions
        run: |
          npm ci --prefix tests/cloud-functions/functions --legacy-peer-deps
          npm --prefix tests/cloud-functions/functions run build

      - name: Build iOS integration app
        run: |
          dotnet build tests/Plugin.Firebase.IntegrationTests/Plugin.Firebase.IntegrationTests.csproj \
            -c Debug \
            -f net9.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl create PluginFirebaseIntegration "iPhone 16" || xcrun simctl create PluginFirebaseIntegration "iPhone 15")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iOS integration tests against emulators
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd tests/cloud-functions
          firebase emulators:exec \
              --project "$FIREBASE_PROJECT_ID" \
              --only auth,firestore,functions,storage \
              "node scripts/seed-auth-emulator.js && xharness apple test --target ios-simulator-64 --device $DEVICE_ID --timeout=00:10:00 --launch-timeout=00:10:00 --app ../Plugin.Firebase.IntegrationTests/bin/Debug/net9.0-ios/iossimulator-arm64/Plugin.Firebase.IntegrationTests.app --output-directory ../../artifacts/test-results/ios --set-env=PLUGIN_FIREBASE_TEST_BACKEND=emulator"

      - name: Cleanup iOS simulator
        if: always()
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl shutdown "$DEVICE_ID" || true
            xcrun simctl delete "$DEVICE_ID" || true
          fi

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-results
          path: artifacts/test-results/ios
          if-no-files-found: ignore
