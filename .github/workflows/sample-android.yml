name: sample-android (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_sample_android:
    runs-on: ubuntu-latest
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFICATION_LEVEL: Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json
      - name: Build Playground (Android)
        run: dotnet build sample/Playground/Playground.csproj -c Debug -f net10.0-android -p:TargetFrameworks=net10.0-android
