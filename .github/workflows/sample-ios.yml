name: sample-ios (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_sample_ios:
    runs-on: macos-26
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFICATION_LEVEL: Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Select Xcode for .NET iOS workload
        run: |
          for xcode in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.6.0.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done

          echo "No compatible Xcode 26.6 installation found." >&2
          ls -1 /Applications/Xcode*.app >&2
          exit 1
      - name: Install iOS workload
        run: sudo "$DOTNET_ROOT/dotnet" workload install maui-ios --source https://api.nuget.org/v3/index.json
      - name: Build Playground (iOS simulator, no signing)
        run: |
          dotnet build sample/Playground/Playground.csproj \
            -c Debug \
            -f net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false
